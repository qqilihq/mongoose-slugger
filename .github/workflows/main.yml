name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `22.0.0` is the exact floor `engines.node` promises, not `22.x`, which
        # resolves to the newest 22 and would pass on APIs added later in the line
        node-version: ['22.0.0', '24.x']

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # reads the pnpm version from the `packageManager` field
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # `--no-runtime` skips installing the runtime pinned in `devEngines.runtime`,
      # which pnpm would otherwise substitute for the version above, making both
      # legs run the same Node. It leaves node_modules deliberately inconsistent
      # with the lockfile, so the deps-status check has to be disabled too or every
      # `pnpm run` reinstalls that runtime. Both are needed; neither works alone.
      - name: Lint, test, and build
        env:
          pnpm_config_verify_deps_before_run: 'false'
        run: |
          node -v
          pnpm install --frozen-lockfile --no-runtime
          pnpm exec node -v
          pnpm run lint
          pnpm run test --coverage
          pnpm run build

      - name: Pack the publishable tarball
        if: matrix.node-version == '24.x'
        run: pnpm pack --pack-destination .

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '24.x'
        with:
          name: tarball
          path: ./*.tgz

      # only report coverage once, rather than once per matrix entry
      - uses: codecov/codecov-action@v5
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Installs the packed tarball the way a consumer would and imports it. This is
  # the only check that exercises what consumers actually get -- the `exports`
  # map, `main`/`types`, and whether the entry point runs on the oldest runtime
  # `engines.node` promises. It uses npm and a plain `node`, never pnpm, so the
  # version below is the version it really runs on.
  consumer:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `22.0.0` is the exact floor `engines.node: ">=22"` promises, not
        # `22.x` -- which resolves to the newest 22 release and would let an
        # API added later in the 22 line pass here while breaking a consumer
        # on the version we actually claim to support. `24.x` is Active LTS.
        node-version: ['22.0.0', '24.x']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install and import as a consumer
        run: |
          node -v
          mkdir consumer && cd consumer
          printf '{"name":"c","version":"1.0.0","private":true}\n' > package.json
          npm install ../*.tgz mongoose@9
          node -e "const m = require('mongoose-slugger-plugin'); console.log(Object.keys(m))"
          node --input-type=module -e "import { sluggerPlugin } from 'mongoose-slugger-plugin'; console.log(typeof sluggerPlugin)"
          # the internal module must stay unreachable
          if node -e "require('mongoose-slugger-plugin/dist/sluggerUtils')" 2>/dev/null; then
            echo "internal module is importable; the exports map is not doing its job" >&2
            exit 1
          fi
