# Single-package repository, so there is no `packages:` list here; this file
# exists because pnpm 11 reads its settings from it.

allowBuilds:
  # downloads the MongoDB binary used by the tests during install
  mongodb-memory-server-global: true

# our own package, installed right after publishing it; pnpm otherwise refuses
# releases younger than its minimum release age
minimumReleaseAgeExclude:
  - '@qqilihq/changelog-keeper@0.1.0-beta.0'
